<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-200 h-screen flex justify-center items-center">
    <div class="bg-white p-8 rounded-lg">
        <a href="/index.html" class="my-5 text-purple-600 hover:underline">Voltar</a>
        <h1 class="text-3xl text-purple-900 font-bold mb-6">Cadastro</h1>
        
        <form onsubmit="cadastrar()" class="flex flex-col w-80">
            <label for="nome" class="block text-sm font-semibold text-gray-700 mb-2">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400"
                required />

            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2 mt-5">Digite seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400"
                required />
                
            <label for="senha" class="block text-sm font-semibold text-gray-700 mb-2 mt-5">Digite sua senha:</label>
            <input type="password" id="senha" name="senha" placeholder="********"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400"
                required />

            <button type="submit"
                class="w-full mt-10 px-4 py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700">Cadastrar</button>

        </form>


    </div>
    <script>
        function cadastrar() {
            event.preventDefault();

            let nome = document.querySelector("#nome").value;
            let email = document.querySelector("#email").value;
            let senha = document.querySelector("#senha").value;

            let dados = {
                nome,
                email,
                senha
            }

            fetch("https://js-lista-de-tarefas-api.onrender.com/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            })
                .then(response => response.json())
                .then(json => {
                    if (json.tipo == "erro") {
                        alert(json.mensagem);
                        return;

                    }
                    alert(json.mensagem);
                    window.location.href = "/index.html";
                })
                .catch(error => {
                    alert(error.message);

                })


            console.log(dados);

        }
    </script>
</body>

</body>

</html>
