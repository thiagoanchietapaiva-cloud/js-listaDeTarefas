<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-200 h-screen flex justify-center items-center">
    <div class="bg-white p-8 rounded-lg">
        <h1 class="text-3xl text-purple-900 font-bold mb-6">Seja bem-vindo à sua Lista de Tarefas!</h1>
        <form>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Digite seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400"
                required />
        </form>
        <form>
            <label for="senha" class="block text-sm font-semibold text-gray-700 mb-2">Digite sua senha:</label>
            <input type="password" id="senha" name="senha" placeholder="********"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400"
                required />
            <a href="/cadastrar.html" class="my-5 text-purple-600 hover:underline">Cadastre-se</a>
            <button type="submit"
                class="w-full mt-4 px-4 py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700">Entrar</button>

        </form>


    </div>
</body>

</body>

</html>
